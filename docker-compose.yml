services:
  bot:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      NSFW_API_URL: ${NSFW_API_URL}
      NSFW_API_KEY: ${NSFW_API_KEY}
      NSFW_API_USER_ID: ${NSFW_API_USER_ID}
      OLLAMA_BASE_URL: http://ollama:11434
      BOT_ADMIN_IDS: ${BOT_ADMIN_IDS}
      MC_SERVER_HOST: ${MC_SERVER_HOST:-}
      MC_SERVER_PORT: ${MC_SERVER_PORT:-}
      MC_POLL_SECONDS: ${MC_POLL_SECONDS:-}
      MC_SERVER_SHOW_IP: ${MC_SERVER_SHOW_IP:-}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    # Allows the bot container to reach Ollama and other services
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "ollama:${OLLAMA_HOST_IP:-host-gateway}"
    # Public resolvers, bypassing the LAN Pi-hole: its local DNS record for
    # the DDNS name would resolve MC_SERVER_HOST to the LAN IP, making the
    # !mc ping measure a same-host hop instead of the external route.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
