services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      RULE34_API_KEY: ${RULE34_API_KEY}
      RULE34_USER_ID: ${RULE34_USER_ID}
      OLLAMA_BASE_URL: http://ollama:11434
    # Allows the bot container to reach Ollama and other services
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "ollama:192.168.68.82"
    volumes:
      - /volume1/docker/ollama_discord_bot:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
