services:
  bot:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      # The standalone yt-dlp unpacks itself at every start and can't on
      # the noexec default above; YTDLP_TMPDIR sends only it here.
      - /run/ytdlp:exec,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # yt-dlp (!announce <youtube link>) updates itself here; the image seeds
    # a new volume with its pinned copy (see the Dockerfile).
    volumes:
      - ytdlp:/opt/ytdlp
    # ${VAR:-} gives an empty default so Portainer doesn't warn "variable not
    # set". A var missing from this block never reaches the container.
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      NSFW_API_URL: ${NSFW_API_URL}
      NSFW_API_KEY: ${NSFW_API_KEY}
      NSFW_API_USER_ID: ${NSFW_API_USER_ID}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-}
      ACTIVE_CHANNEL_IDS: ${ACTIVE_CHANNEL_IDS:-}
      BOT_ADMIN_IDS: ${BOT_ADMIN_IDS}
      MC_SERVER_HOST: ${MC_SERVER_HOST:-}
      MC_SERVER_PORT: ${MC_SERVER_PORT:-}
      MC_POLL_SECONDS: ${MC_POLL_SECONDS:-}
      MC_SERVER_SHOW_IP: ${MC_SERVER_SHOW_IP:-}
      MC_CONSOLE_HOST: ${MC_CONSOLE_HOST:-}
      MC_CONSOLE_PORT: ${MC_CONSOLE_PORT:-}
      MC_CONSOLE_PASSWORD: ${MC_CONSOLE_PASSWORD:-}
      WYOMING_TTS_HOST: ${WYOMING_TTS_HOST:-}
      WYOMING_TTS_PORT: ${WYOMING_TTS_PORT:-}
      WYOMING_TTS_VOICE: ${WYOMING_TTS_VOICE:-}
      YTDLP_PATH: ${YTDLP_PATH:-/opt/ytdlp/yt-dlp}
      YTDLP_TMPDIR: ${YTDLP_TMPDIR:-/run/ytdlp}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    # The MCP sidecar below shares this namespace (network_mode: service:bot),
    # so its port is published here. MCP_BIND_IP must be the host's LAN
    # address — the default keeps it on the host's loopback until it is set.
    ports:
      - "${MCP_BIND_IP:-127.0.0.1}:${MCP_PORT:-8765}:${MCP_PORT:-8765}"
    # `ollama` (OLLAMA_BASE_URL above) is OLLAMA_HOST_IP, or the Docker host if unset.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "ollama:${OLLAMA_HOST_IP:-host-gateway}"
    # Public resolvers, bypassing the LAN Pi-hole: its local DNS record for
    # the DDNS name would resolve MC_SERVER_HOST to the LAN IP, making the
    # !mc ping measure a same-host hop instead of the external route.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Read-only MCP sidecar (botmcp/). Off unless the `mcp` profile is on
  # (COMPOSE_PROFILES=mcp in the stack env). Shares the bot's network
  # namespace to read its loopback-only /state views; its own image and
  # lock; a SELECT-only DB account; never the Discord token.
  mcp:
    build: botmcp
    profiles: ["mcp"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: "service:bot"
    depends_on:
      - bot
    environment:
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_BIND_IP: ${MCP_BIND_IP:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_PORT: ${MCP_PORT:-8765}
      MCP_DB_USER: ${MCP_DB_USER:-}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ytdlp:
