services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .config
    # Allows the bot container to reach Ollama running on the host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bot_data:/app/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
    driver: local
