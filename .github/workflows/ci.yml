name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.10"

      - name: Cache installed packages
        id: pip-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ env.pythonLocation }}
          key: pip-${{ runner.os }}-py3.10-${{ hashFiles('requirements.lock') }}-v1

      - name: Install dependencies
        if: steps.pip-cache.outputs.cache-hit != 'true'
        run: |
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-asyncio ruff bandit pip-audit

      - name: Lint
        run: ruff check src/ tests/

      - name: Gitleaks (secret scan)
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Bandit (security lint)
        run: bandit -r src/ --severity-level medium

      - name: pip-audit (CVE scan)
        run: pip-audit -r requirements.lock --strict

      - name: Run tests
        run: pytest -q

      - name: Build container image
        run: docker build -t bot:ci .

      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: bot:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
