name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-asyncio ruff bandit pip-audit

      - name: Lint
        run: ruff check src/ tests/

      - name: Gitleaks (secret scan)
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Bandit (security lint)
        run: bandit -r src/ --severity-level medium

      - name: pip-audit (CVE scan)
        run: pip-audit -r requirements.lock --strict

      - name: Run tests
        run: pytest -q

      - name: Build container image
        run: docker build -t bot:ci .

      - name: Cache Trivy DB
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        continue-on-error: true
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Trivy scan (image)
        run: |
          TRIVY_VERSION=0.70.0
          if ! command -v trivy >/dev/null; then
            curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
              | sudo tar -xz -C /usr/local/bin trivy
          fi
          trivy image bot:ci \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --vuln-type os,library
