name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-asyncio ruff bandit pip-audit

      - name: Lint
        run: ruff check src/ tests/

      - name: Bandit (security lint)
        run: bandit -r src/ --severity-level medium

      - name: pip-audit (CVE scan)
        run: pip-audit -r requirements.lock --strict

      - name: Run tests
        run: pytest -q
