name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install pytest pytest-asyncio ruff bandit pip-audit

      - name: Lint
        run: ruff check src/ tests/

      - name: Gitleaks (secret scan)
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Bandit (security lint)
        run: bandit -r src/ --severity-level medium

      - name: pip-audit (CVE scan)
        run: pip-audit -r requirements.lock --strict

      - name: Run tests
        run: pytest -q
