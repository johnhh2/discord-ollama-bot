[project]
name = "discord-ollama-bot"
version = "0.1.0"
description = "Discord bot with Ollama-backed chat, MariaDB-backed economy, gambling games, role/channel shop, lottery, levels, and a tiered permission system."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "John-Hugh" }]
dependencies = [
    "discord.py==2.7.1",
    "aiohttp==3.14.3",
    "python-dotenv==1.2.2",
    "tzdata==2026.2",
    "matplotlib==3.10.9",
    "aiomysql==0.3.2",
    "prometheus-client==0.25.0",
    "chess==1.11.2",
    "cairosvg==2.9.0",
    "mcstatus==14.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "bandit", "pip-audit", "pip-tools"]

[project.urls]
Repository = "https://github.com/johnhh2/discord-ollama-bot"

[tool.ruff.lint]
# F catches real bugs; E/W catch syntax and whitespace issues. E501 is off:
# line length is style, not correctness, and enforcing it means a large
# reflow. E741 is off: short loop variables read fine in comprehensions.
select = ["E", "F", "W"]
ignore = ["E501", "E741"]
