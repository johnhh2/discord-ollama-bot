[project]
name = "discord-ollama-bot"
version = "0.1.0"
description = "Discord bot with Ollama-backed chat, MariaDB-backed economy, gambling games, role/channel shop, lottery, levels, and a tiered permission system."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "John-Hugh" }]
dependencies = [
    "discord.py>=2.3.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "matplotlib>=3.8.0",
    "aiomysql>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.urls]
Repository = "https://github.com/johnhh2/discord-ollama-bot"

[tool.ruff.lint]
# Pyflakes (F) catches real bugs; pycodestyle errors (E) and warnings (W)
# catch syntax/whitespace issues. E501 (line length) is excluded — line
# length is a style preference, not a correctness signal, and forcing it
# would be a large reflow with no real value for a project this size.
select = ["E", "F", "W"]
ignore = ["E501"]
